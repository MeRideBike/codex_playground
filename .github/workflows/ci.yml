name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: Build and test (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore ForgeBoard.sln
      - run: dotnet build ForgeBoard.sln --no-restore --configuration Release
      - run: dotnet test ForgeBoard.sln --no-build --configuration Release

  web:
    name: Build dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/ForgeBoard.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/ForgeBoard.Web/package-lock.json
      - run: npm ci
      - run: npm run build
