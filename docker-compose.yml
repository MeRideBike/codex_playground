services:
  forgeboard-api:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - forgeboard-data:/app/data
    environment:
      ConnectionStrings__ForgeBoard: Data Source=/app/data/forgeboard.db
      ForgeBoard__SamplesRoot: /app/samples
      ForgeBoard__RunWorkspacesRoot: /app/data/runs
volumes:
  forgeboard-data:
